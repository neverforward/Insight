<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Insight</title>
  <desc>A block with its info lines and the mod name: what you are looking at, explained.</desc>

  <!-- HUD panel background -->
  <rect x="0" y="0" width="256" height="256" rx="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- the block under the crosshair (isometric stone cube), centred together
       with the info lines: the pair spans x 42..214, i.e. centre x = 128 -->
  <g stroke="#0d1117" stroke-width="3" stroke-linejoin="round">
    <path d="M86 56 L130 78 L86 100 L42 78 Z" fill="#c7d1da"/>
    <path d="M42 78 L86 100 L86 146 L42 124 Z" fill="#93a1ad"/>
    <path d="M130 78 L86 100 L86 146 L130 124 Z" fill="#6b7883"/>
  </g>

  <!-- info lines, like the panel text: one bright value, two dim labels -->
  <g>
    <rect x="150" y="73" width="64" height="10" rx="5" fill="#e6edf3"/>
    <rect x="150" y="91" width="44" height="10" rx="5" fill="#8b949e"/>
    <rect x="150" y="109" width="56" height="10" rx="5" fill="#8b949e"/>
  </g>

  <!-- project name: hand-drawn 5x7 pixel lettering (no font involved), kept in
       a grey between the label bars and the value white: readable, but still
       clearly secondary to the block and the value bar.
       unit 4px, letter pitch 24px, spans x 46..210 so it stays centred -->
